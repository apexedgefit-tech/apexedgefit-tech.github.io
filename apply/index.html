<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply for coaching | Alex Maywood</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #2A66C8;
    --accent-deep: #1C4488;
    --accent-text: #ffffff;
    --detail: #C8964E;
    --bg: #0B0C0E;
    --text: #F3F4F2;
    --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --display: Archivo, Inter, system-ui, sans-serif;
    --muted: color-mix(in srgb, var(--text) 64%, transparent);
    --line: color-mix(in srgb, var(--text) 18%, transparent);
    --panel: color-mix(in srgb, var(--text) 5%, transparent);
    --error: #ff6b6b;
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    min-height: 100vh; min-height: 100dvh; -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  /* very slight blue grain, same feel as the landing page close */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
    background: radial-gradient(120% 70% at 50% 110%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--detail); outline-offset: 3px; }
  [tabindex="-1"]:focus { outline: none; }
  ::selection { background: var(--accent); color: #fff; }

  /* Top: progress line, then back button + logo */
  .top { position: fixed; top: 0; left: 0; right: 0; z-index: 5; background: linear-gradient(var(--bg) 70%, transparent); }
  .bar { height: 3px; background: var(--line); }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .5s var(--ease); }
  .topin { position: relative; display: flex; align-items: center; justify-content: center; height: 64px; padding: 0 12px; }
  .logo { height: 32px; width: auto; display: block; }
  .back {
    position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
    display: inline-flex; align-items: center; gap: 8px; min-height: 44px; min-width: 44px; padding: 0 12px;
    background: none; border: 0; border-radius: 8px; color: var(--muted); cursor: pointer; font-size: .95rem;
    opacity: 0; visibility: hidden; transition: opacity .2s, color .15s;
  }
  .back.show { opacity: 1; visibility: visible; }
  @media (hover: hover) { .back:hover { color: var(--text); } }

  main { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: flex; }
  .screen {
    width: 100%; max-width: 720px; margin: 0 auto; padding: 112px 24px 72px;
    display: flex; flex-direction: column; justify-content: center; min-height: 100vh; min-height: 100dvh;
    animation: in-fwd .5s var(--ease) both;
  }
  .screen.back-dir { animation-name: in-back; }
  .screen.out { animation: out-fwd .2s ease-in both; }
  .screen.out.back-dir { animation-name: out-back; }
  @keyframes in-fwd  { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: none; } }
  @keyframes in-back { from { opacity: 0; transform: translateY(-32px); } to { opacity: 1; transform: none; } }
  @keyframes out-fwd  { to { opacity: 0; transform: translateY(-24px); } }
  @keyframes out-back { to { opacity: 0; transform: translateY(24px); } }
  /* pieces of a screen arrive one after another */
  .screen > * { animation: rise .55s var(--ease) both; }
  .screen > *:nth-child(2) { animation-delay: .05s; }
  .screen > *:nth-child(3) { animation-delay: .1s; }
  .screen > *:nth-child(4) { animation-delay: .15s; }
  .screen > *:nth-child(n+5) { animation-delay: .2s; }
  .screen.out > * { animation: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .num { font-size: .8125rem; letter-spacing: .14em; text-transform: uppercase; color: var(--detail); font-weight: 600; margin: 0 0 16px; }
  .num .opt { color: var(--muted); letter-spacing: .04em; text-transform: none; font-weight: 400; margin-left: 8px; }
  h1 {
    font-family: var(--display); font-stretch: 125%; font-weight: 800; text-transform: uppercase;
    font-size: clamp(1.7rem, 5.4vw, 3.2rem); line-height: 1.05; letter-spacing: -.01em; margin: 0; text-wrap: balance;
  }
  /* welcome heading always sits on one line; size scales with screen width so it fits a 320px phone */
  .welcome h1 { white-space: nowrap; font-size: clamp(1.2rem, 6.3vw, 3.2rem); }
  .q { display: block; margin: 0; font-size: clamp(1.5rem, 4.2vw, 2.4rem); line-height: 1.18; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
  .help, .lead { font-size: 1.0625rem; color: var(--muted); margin: 14px 0 0; line-height: 1.55; max-width: 560px; }
  .meta { display: flex; gap: 18px; flex-wrap: wrap; margin: 26px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: .95rem; }
  .meta li { position: relative; padding-left: 14px; }
  .meta li::before { content: ""; position: absolute; left: 0; top: .32em; width: 4px; height: .8em; background: var(--detail); }

  .field { margin-top: 34px; }
  .text-in {
    width: 100%; background: transparent; border: 0; border-bottom: 2px solid var(--line); border-radius: 0;
    padding: 10px 0; font-size: clamp(1.3rem, 4vw, 1.9rem); caret-color: var(--accent); resize: none;
    transition: border-color .2s;
  }
  textarea.text-in { font-size: clamp(1.1rem, 3vw, 1.35rem); line-height: 1.5; min-height: 3.2em; overflow: hidden; }
  .text-in::placeholder { color: color-mix(in srgb, var(--text) 28%, transparent); }
  .text-in:focus { outline: none; border-bottom-color: var(--accent); }
  .text-in:focus-visible { outline: none; }
  .text-in[aria-invalid="true"] { border-bottom-color: var(--error); }
  .text-in:-webkit-autofill { -webkit-text-fill-color: var(--text); box-shadow: 0 0 0 100px var(--bg) inset; transition: background-color 9999s; }
  .err { min-height: 1.5em; margin: 12px 0 0; color: var(--error); font-size: .975rem; }
  .err:not(:empty) { animation: nudge .3s ease; }
  @keyframes nudge { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  .choices { display: grid; gap: 10px; margin-top: 34px; }
  .choice {
    display: flex; align-items: center; gap: 14px; width: 100%; min-height: 58px; padding: 12px 16px; text-align: left;
    background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 1.0625rem;
    transition: border-color .15s, background-color .15s, transform .15s;
  }
  /* .fresh: the pointer left over from the last click must not make an option look picked */
  @media (hover: hover) { .choices:not(.fresh) .choice:hover { border-color: color-mix(in srgb, var(--accent) 70%, var(--line)); } }
  .choice:active { transform: scale(.99); }
  .choice .key {
    flex: none; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--line); border-radius: 6px; font-size: .78rem; font-weight: 700; color: var(--muted);
    transition: background-color .15s, border-color .15s, color .15s;
  }
  .choice[aria-checked="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 20%, transparent); animation: picked .32s ease; }
  .choice[aria-checked="true"] .key { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  @keyframes picked { 40% { transform: scale(1.015); } }

  .actions { display: flex; align-items: center; gap: 16px; margin-top: 26px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 54px; min-width: 132px; padding: 0 26px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: var(--accent-text); font-size: 1.0625rem; font-weight: 600;
    transition: background-color .18s, transform .12s;
  }
  .btn .arr { transition: transform .18s var(--ease); }
  .btn.ghost { background: transparent; color: var(--text); border: 1.5px solid var(--line); min-width: 0; padding: 0 20px; }
  .btn.ghost .arr { color: var(--muted); }
  #back { display: none; }
  .choice .txt { display: flex; flex-direction: column; gap: 3px; }
  .choice .note { font-size: .9rem; color: var(--muted); line-height: 1.4; }
  /* hover only on real pointers: on phones a tap leaves :hover stuck on the next screen's button */
  @media (hover: hover) {
    .btn:hover { background: var(--accent-deep); }
    .btn:hover .arr { transform: translateX(3px); }
    .btn.ghost:hover { background: var(--panel); border-color: color-mix(in srgb, var(--text) 40%, transparent); }
    .btn.ghost:hover .arr { transform: translateX(-3px); color: var(--text); }
  }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: .6; cursor: default; }
  .hint { color: var(--muted); font-size: .875rem; }
  .hint kbd { font: inherit; font-weight: 600; color: var(--text); }
  @media (hover: none) { .hint { display: none; } }

  .spin { width: 28px; height: 28px; margin-top: 26px; border: 2.5px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: turn .8s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }

  .link { color: var(--text); text-decoration-color: var(--detail); text-underline-offset: 3px; }
  /* Starting height while Calendly loads; after that Calendly sets the real height inline. */
  /* min-height: while a Calendly step loads it briefly reports ~2px, which would collapse the box and jump the page */
  /* scroll-margin-top: Calendly scrolls the box into view between steps; keep its top (and its back arrow) clear of the fixed logo bar */
  .cal { margin: 20px -8px 0; min-width: 300px; height: 720px; min-height: 600px; scroll-margin-top: 72px; }
  .cal iframe { display: block; width: 100%; height: 100%; }
  .fallback { margin-top: 12px; color: var(--muted); font-size: .95rem; }
  .screen.wide { max-width: 1000px; justify-content: flex-start; padding-top: 104px; }

  .hp { position: absolute; left: -9999px; top: auto; width: 1px; height: 1px; overflow: hidden; }

  @media (max-width: 560px) {
    .screen { padding: 96px 20px 48px; justify-content: flex-start; }
    .screen.q-screen { padding-top: 18vh; }
    .screen.welcome { justify-content: center; padding-bottom: 96px; }
    .actions .btn { flex: 1 1 0; }
    .actions .btn.ghost { flex: 0 0 auto; }
    .cal { margin: 16px -20px 0; height: 1000px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen, .screen > *, .screen.out, .choice[aria-checked="true"], .err:not(:empty) { animation: none !important; }
    .bar > div, .choice, .btn, .back { transition: none; }
  }
  /* 2026-11-13: match the landing page. Square corners, lighter caps headline with the same sheen and lift,
     and the same Apply-button feel (glow, hover lift and sheen, press squeeze, ripple from the tap point). */
  h1 { font-stretch: 125%; font-weight: 700; letter-spacing: .012em; word-spacing: .08em; line-height: 1.12;
    background-image: linear-gradient(180deg, #FFFFFF 0%, #F1F3F8 45%, #BFC8DA 100%); background-size: 100% 1lh; background-repeat: repeat-y;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 8px 20px rgba(0, 0, 0, .55)) drop-shadow(0 0 28px rgba(74, 122, 230, .16)); }
  .welcome h1 { white-space: normal; font-size: clamp(1.75rem, 7.4vw, 3.2rem); }
  .btn, .btn.ghost, .choice, .choice .key { border-radius: 0; }
  .btn { position: relative; isolation: isolate; overflow: hidden; -webkit-tap-highlight-color: transparent;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 8px 22px -10px rgba(42, 102, 200, .7);
    transition: transform .22s var(--ease), box-shadow .22s var(--ease), background-color .2s ease; }
  .btn.ghost { box-shadow: none; }
  .btn > span { position: relative; z-index: 1; }
  .btn:not(.ghost)::after { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .26) 50%, transparent 70%); transform: translateX(-130%); }
  .btn .ripple { position: absolute; z-index: 0; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255, 255, 255, .5) 0%, rgba(255, 255, 255, .18) 45%, rgba(255, 255, 255, 0) 70%);
    transform: scale(0); animation: btn-ripple .6s cubic-bezier(.2, .7, .3, 1) forwards; }
  @keyframes btn-ripple { to { transform: scale(var(--rs, 24)); opacity: 0; } }
  .btn:active { transform: scale(.97); transition-duration: .08s; }
  @media (hover: hover) and (pointer: fine) {
    .btn:not(.ghost):hover { background: #3574DA; transform: translateY(-2px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 16px 34px -12px rgba(53, 116, 218, .85), 0 0 0 1px rgba(150, 186, 245, .3); }
    .btn:not(.ghost):hover::after { transform: translateX(130%); transition: transform .75s var(--ease); }
    .btn:hover .arr { transform: translateX(5px); }
    .btn:active { transform: translateY(0) scale(.97); }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn, .btn:hover, .btn:active { transform: none; }
    .btn::after, .btn .ripple { display: none; }
  }
</style>
</head>
<body>
<div class="top">
  <div class="bar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div>
  <div class="topin">
    <button type="button" class="back" id="back" aria-label="Go back"><span aria-hidden="true">&larr;</span> Back</button>
    <a href="/" aria-label="Alex Maywood home"><img class="logo" src="logo-am-bronze.png" alt="Alex Maywood" width="30" height="32"></a>
  </div>
</div>
<div class="hp" aria-hidden="true"><input type="text" name="website" id="website" tabindex="-1" autocomplete="off"></div>
<main id="main"></main>

<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var CFG = window.FORM_CONFIG || {};
  var QS = CFG.questions || [];
  var N = QS.length;
  var main = document.getElementById('main');
  var backBtn = document.getElementById('back');
  var fill = document.getElementById('fill');
  var bar = document.querySelector('.bar');
  var honeypot = document.getElementById('website');

  // Theme
  var th = CFG.theme || {};
  var root = document.documentElement.style;
  if (th.accent) root.setProperty('--accent', th.accent);
  if (th.accentText) root.setProperty('--accent-text', th.accentText);
  if (th.background) root.setProperty('--bg', th.background);
  if (th.text) root.setProperty('--text', th.text);
  if (th.fontFamily) root.setProperty('--font', th.fontFamily);

  // State: step -1 = welcome, 0..N-1 = questions, N = finished
  var state = { step: -1, answers: {} };
  window.__formState = state;
  var submitting = false;
  var advanceTimer = null;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  var swapping = false;
  var typeAhead = '';
  var enterAhead = false;
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var touch = window.matchMedia && matchMedia('(hover: none)').matches;
  // Old screen slides out, then the new one slides in. Input is ignored during the swap.
  function mount(node, backwards, wide, focusEl) {
    node.className += ' screen' + (backwards ? ' back-dir' : '') + (wide ? ' wide' : '');
    var old = main.firstElementChild;
    function show() {
      main.innerHTML = '';
      main.appendChild(node);
      window.scrollTo(0, 0);
      swapping = false;
      if (focusEl) { try { focusEl.focus({ preventScroll: true }); } catch (e) { focusEl.focus(); } }
      // Keys typed during the swap go into the new box instead of being lost
      if (typeAhead && focusEl && focusEl.classList && focusEl.classList.contains('text-in')) {
        focusEl.value += typeAhead;
        try { focusEl.setSelectionRange(focusEl.value.length, focusEl.value.length); } catch (e) {}
      }
      typeAhead = '';
      if (enterAhead) { enterAhead = false; if (state.step >= 0 && state.step < N) next(); }
    }
    if (!old || reduceMotion) { show(); return; }
    swapping = true;
    old.className = old.className.replace(/\s?back-dir/, '') + ' out' + (backwards ? ' back-dir' : '');
    setTimeout(show, 190);
  }

  function setProgress() {
    var pct = 0;
    if (state.step >= N) pct = 100;
    else if (state.step >= 0) pct = Math.round(((state.step + 1) / N) * 100);
    fill.style.width = pct + '%';
    bar.setAttribute('aria-valuenow', String(pct));
    backBtn.className = 'back' + (state.step >= 0 && state.step < N ? ' show' : '');
  }

  function focusSoon(node) {
    if (node) setTimeout(function () { try { node.focus(); } catch (e) {} }, 60);
  }
  function btn(text) {
    var b = el('button', 'btn');
    b.type = 'button';
    b.appendChild(el('span', '', text));
    var a = el('span', 'arr', '\u2192'); a.setAttribute('aria-hidden', 'true');
    b.appendChild(a);
    return b;
  }
  function hint(key, extra) {
    var p = el('span', 'hint', 'Press ');
    p.appendChild(el('kbd', '', key));
    if (extra) p.appendChild(document.createTextNode(extra));
    return p;
  }
  function grow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }

  // Screens
  function renderWelcome(backwards) {
    var s = el('section', 'welcome');
    if (CFG.eyebrow) s.appendChild(el('p', 'num', CFG.eyebrow));
    s.appendChild(el('h1', '', CFG.title || 'Welcome'));
    if (CFG.intro) s.appendChild(el('p', 'lead', CFG.intro));
    if (CFG.meta && CFG.meta.length) {
      var m = el('ul', 'meta');
      CFG.meta.forEach(function (t) { m.appendChild(el('li', '', t)); });
      s.appendChild(m);
    }
    var actions = el('div', 'actions');
    var b = btn(CFG.startLabel || 'Start');
    b.addEventListener('click', function () { go(0); });
    actions.appendChild(b);
    actions.appendChild(hint('Enter'));
    s.appendChild(actions);
    mount(s, backwards, false, touch ? null : b);
  }

  function renderQuestion(i, backwards) {
    var q = QS[i];
    var s = el('section', 'q-screen');
    var num = el('p', 'num', (i + 1) + ' of ' + N);
    if (!q.required) num.appendChild(el('span', 'opt', 'Optional'));
    s.appendChild(num);

    var inputId = 'q-' + q.id;
    var errId = 'err-' + q.id;
    var label = el('label', 'q', q.label);
    label.id = 'lbl-' + q.id;
    var input = null;
    var group = null;

    if (q.type === 'choice') {
      label.removeAttribute('for');
      s.appendChild(label);
    } else {
      label.setAttribute('for', inputId);
      s.appendChild(label);
    }
    if (q.help) {
      var h = el('p', 'help', q.help);
      h.id = 'help-' + q.id;
      s.appendChild(h);
    }

    var err = el('p', 'err');
    err.id = errId;
    err.setAttribute('aria-live', 'polite');

    var field = el('div', 'field');
    var cur = state.answers[q.id];

    if (q.type === 'choice') {
      field.className = '';
      group = el('div', 'choices fresh');
      group.addEventListener('mousemove', function () { group.classList.remove('fresh'); }, { once: true });
      group.setAttribute('role', 'radiogroup');
      group.setAttribute('aria-labelledby', label.id);
      (q.options || []).forEach(function (opt, k) {
        var b = el('button', 'choice');
        b.type = 'button';
        b.setAttribute('role', 'radio');
        b.setAttribute('aria-checked', cur === opt.value ? 'true' : 'false');
        b.dataset.value = opt.value;
        b.appendChild(el('span', 'key', String.fromCharCode(65 + k)));
        var txt = el('span', 'txt');
        txt.appendChild(el('span', '', opt.label));
        if (opt.note) txt.appendChild(el('span', 'note', opt.note));
        b.appendChild(txt);
        b.addEventListener('click', function () { pick(i, opt.value, group); });
        group.appendChild(b);
      });
      s.appendChild(group);
    } else {
      if (q.type === 'longtext') {
        input = el('textarea', 'text-in');
        input.rows = 2;
        input.addEventListener('input', function () { grow(this); });
      } else {
        input = el('input', 'text-in');
        input.type = q.type === 'email' ? 'email' : (q.type === 'tel' ? 'tel' : 'text');
        if (q.type === 'email') input.autocomplete = 'email';
        if (q.type === 'tel') input.autocomplete = 'tel';
        if (q.type === 'name') input.autocomplete = 'name';
        else if (q.id === 'first_name') input.autocomplete = 'given-name';
      }
      input.id = inputId;
      input.name = q.id;
      if (q.placeholder) input.placeholder = q.placeholder;
      input.value = cur || '';
      input.setAttribute('aria-describedby', (q.help ? 'help-' + q.id + ' ' : '') + errId);
      if (q.required) input.setAttribute('aria-required', 'true');
      field.appendChild(input);
      s.appendChild(field);
    }

    s.appendChild(err);

    var actions = el('div', 'actions');
    var bk = el('button', 'btn ghost');
    bk.type = 'button';
    bk.setAttribute('aria-label', 'Back to the previous question');
    var ba = el('span', 'arr', '\u2190'); ba.setAttribute('aria-hidden', 'true');
    bk.appendChild(ba);
    bk.appendChild(el('span', '', 'Back'));
    bk.addEventListener('click', function () { back(); });
    actions.appendChild(bk);
    var ok = btn(i === N - 1 ? (CFG.finishLabel || 'Finish') : 'Next');
    ok.addEventListener('click', function () { next(); });
    if (q.type !== 'choice' || cur) actions.appendChild(ok);
    if (q.type === 'choice') {
      var letters = (q.options || []).map(function (o, k) { return String.fromCharCode(65 + k); });
      var ch = el('span', 'hint', 'Or press ');
      ch.appendChild(el('kbd', '', letters.slice(0, -1).join(', ') + (letters.length > 1 ? ' or ' : '') + letters[letters.length - 1]));
      actions.appendChild(ch);
    } else {
      actions.appendChild(q.type === 'longtext' ? hint('Enter', ' \u00b7 Shift+Enter for a new line') : hint('Enter'));
    }
    s.appendChild(actions);

    var target = input || group.querySelector('[aria-checked="true"]') || null;
    // On phones, do not pop the keyboard open for choice questions
    mount(s, backwards, false, (touch && !input) ? null : target);
    if (input && input.tagName === 'TEXTAREA') setTimeout(function () { grow(input); }, 0);
  }

  function currentInput() {
    return main.querySelector('.text-in');
  }

  function showError(q, msg) {
    var err = document.getElementById('err-' + q.id);
    if (err) err.textContent = msg;
    var input = currentInput();
    if (input) {
      if (msg) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
      if (msg) input.focus();
    }
  }

  function validate(q, val) {
    var v = (val || '').trim();
    if (!v) return q.required ? 'This one is required.' : '';
    if (q.type === 'name' && v.split(/\s+/).length < 2) return 'Add your last name too.';
    if (q.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return 'Enter a valid email address.';
    if (q.type === 'tel') {
      var digits = v.replace(/\D/g, '');
      if (!/^[0-9\s+\-()]+$/.test(v) || digits.length < 7) return 'Enter a valid phone number.';
    }
    return '';
  }

  function pick(i, value, group) {
    if (state.step !== i || submitting || swapping) return;
    state.answers[QS[i].id] = value;
    Array.prototype.forEach.call(group.children, function (b) {
      b.setAttribute('aria-checked', b.dataset.value === value ? 'true' : 'false');
    });
    showError(QS[i], '');
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(function () { if (state.step === i) next(); }, 380);
  }

  function next() {
    clearTimeout(advanceTimer);
    var i = state.step;
    if (i < 0 || i >= N || submitting || swapping) return;
    var q = QS[i];
    var val;
    if (q.type === 'choice') {
      val = state.answers[q.id] || '';
    } else {
      var inp = currentInput();
      val = inp ? inp.value.trim() : '';
    }
    var msg = validate(q, val);
    if (msg) { showError(q, msg); return; }
    if (q.type !== 'choice') state.answers[q.id] = q.type === 'name' ? val.replace(/\s+/g, ' ') : val;
    if (i === N - 1) finish(); else go(i + 1);
  }

  function back() {
    clearTimeout(advanceTimer);
    if (submitting || swapping) return;
    if (state.step === 0) go(-1);
    else if (state.step > 0 && state.step < N) go(state.step - 1);
  }

  function go(step) {
    var backwards = step < state.step;
    state.step = step;
    setProgress();
    if (step < 0) renderWelcome(backwards);
    else renderQuestion(step, backwards);
  }

  // Finish
  // Name parts from the "name" (full name) question, or an older "first_name" question.
  function nameParts() {
    var nq = QS.filter(function (q) { return q.type === 'name'; })[0];
    if (nq) {
      var full = (state.answers[nq.id] || '').trim();
      var parts = full ? full.split(/\s+/) : [];
      return { asked: true, full: full, first: parts[0] || '', last: parts.slice(1).join(' ') };
    }
    var f = state.answers.first_name || '';
    return { asked: QS.some(function (q) { return q.id === 'first_name'; }), full: f, first: f, last: '' };
  }

  function isQualified() {
    for (var i = 0; i < QS.length; i++) {
      var q = QS[i];
      if (q.type !== 'choice') continue;
      var v = state.answers[q.id];
      var opts = q.options || [];
      for (var k = 0; k < opts.length; k++) {
        if (opts[k].value === v && opts[k].disqualify) return false;
      }
    }
    return true;
  }

  function finish() {
    if (submitting) return;
    submitting = true;
    var qualified = isQualified();
    var payload = {};
    QS.forEach(function (q) { payload[q.id] = state.answers[q.id] || ''; });
    // The Sheet script names the Pipeline row from first_name, so send the parts too.
    if (QS.some(function (q) { return q.type === 'name'; })) {
      var np = nameParts();
      payload.first_name = np.first;
      payload.last_name = np.last;
    }
    payload.qualified = qualified ? 'yes' : 'no';
    // Flag-only options: the person still books, but the Sheet row is marked.
    var flags = [];
    QS.forEach(function (q) {
      if (q.type !== 'choice') return;
      (q.options || []).forEach(function (o) {
        if (o.value === state.answers[q.id] && o.flag) flags.push(o.flag === true ? o.label : String(o.flag));
      });
    });
    payload.flagged = flags.join('; ');
    // Lead tag from the chosen option (e.g. Hot / Warm / Exploring)
    var tags = [];
    QS.forEach(function (q) {
      if (q.type !== 'choice') return;
      (q.options || []).forEach(function (o) {
        if (o.value === state.answers[q.id] && o.tag) tags.push(String(o.tag));
      });
    });
    payload.lead_tag = tags.join('; ');
    payload.submittedAt = new Date().toISOString();
    payload.page = location.href;
    payload.website = honeypot ? honeypot.value : '';

    state.step = N;
    setProgress();
    renderSending();

    send(payload).then(function () { showResult(qualified); });
  }

  function send(payload) {
    if (!CFG.sheetEndpoint) {
      console.log('[form] submission', payload);
      return Promise.resolve();
    }
    var req;
    try {
      req = fetch(CFG.sheetEndpoint, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).catch(function () {});
    } catch (e) { req = Promise.resolve(); }
    var wait = new Promise(function (resolve) { setTimeout(resolve, 2500); });
    return Promise.race([req, wait]);
  }

  function renderSending() {
    var s = el('section');
    var h = el('h1', '', 'One moment');
    h.tabIndex = -1;
    s.appendChild(h);
    s.appendChild(el('p', 'lead', 'Saving your answers and loading the calendar.'));
    var sp = el('div', 'spin'); sp.setAttribute('aria-hidden', 'true');
    s.appendChild(sp);
    mount(s, false, false, h);
  }

  function showResult(qualified) {
    if (!qualified) {
      var d = CFG.disqualifiedScreen || {};
      var s = el('section');
      var h = el('h1', '', d.heading || 'Thanks');
      h.tabIndex = -1;
      s.appendChild(h);
      if (d.body) s.appendChild(el('p', 'lead', d.body));
      mount(s, false, false, h);
      return;
    }
    var url = CFG.calendlyUrl || '';
    var np = nameParts();
    var name = np.first;
    var email = state.answers.email;
    var hasPrefill = np.asked && QS.some(function (q) { return q.id === 'email'; });

    if (CFG.calendlyMode === 'redirect') {
      var target = url;
      try {
        var u = new URL(url);
        if (hasPrefill) {
          if (np.full) u.searchParams.set('name', np.full);
          if (np.first) u.searchParams.set('first_name', np.first);
          if (np.last) u.searchParams.set('last_name', np.last);
          if (email) u.searchParams.set('email', email);
        }
        target = u.toString();
      } catch (e) {}
      var r = el('section');
      var rh = el('h1', '', 'Pick a time');
      rh.tabIndex = -1;
      r.appendChild(rh);
      var p = el('p', 'lead', 'Taking you to the calendar. ');
      var a = el('a', 'link', 'Open it now');
      a.href = target;
      p.appendChild(a);
      r.appendChild(p);
      mount(r, false, false, rh);
      setTimeout(function () { location.href = target; }, 400);
      return;
    }

    var c = el('section');
    var ch = el('h1', '', 'Pick a time');
    ch.tabIndex = -1;
    c.appendChild(ch);
    var lead = (CFG.bookingLead || '').replace('{name}', name || 'there');
    if (lead) c.appendChild(el('p', 'lead', lead));
    if (CFG.guestNote && CFG.guestNote.when && state.answers[CFG.guestNote.when.id] === CFG.guestNote.when.value) {
      c.appendChild(el('p', 'lead', CFG.guestNote.text));
    }
    var cal = el('div', 'cal');
    c.appendChild(cal);
    var fb = el('p', 'fallback', 'Calendar not loading? ');
    var fa = el('a', 'link', 'Open it in a new tab');
    fa.href = url;
    fa.target = '_blank';
    fa.rel = 'noopener';
    fb.appendChild(fa);
    c.appendChild(fb);
    mount(c, false, true, ch);

    var calUrl = url;
    try {
      var cu = new URL(url);
      cu.searchParams.set('hide_gdpr_banner', '1');
      cu.searchParams.set('background_color', '0b0c0e');
      cu.searchParams.set('text_color', 'f3f4f2');
      cu.searchParams.set('primary_color', '2a66c8');
      calUrl = cu.toString();
    } catch (e) {}
    // resize: Calendly reports its own height and the box grows to fit it,
    // so the page is the only thing that scrolls (no scroll-inside-a-scroll on phones).
    var opts = { url: calUrl, parentElement: cal, resize: true };
    if (hasPrefill) {
      opts.prefill = {};
      // name fills a single "Name" field; firstName/lastName fill the split First/Last name fields
      if (np.full) opts.prefill.name = np.full;
      if (np.first) opts.prefill.firstName = np.first;
      if (np.last) opts.prefill.lastName = np.last;
      if (email) opts.prefill.email = email;
    }
    // Same shape Calendly's widget sends: { name, first_name, last_name, email }
    calPrefill = null;
    if (opts.prefill) {
      calPrefill = {};
      if (opts.prefill.name) calPrefill.name = opts.prefill.name;
      if (opts.prefill.firstName) calPrefill.first_name = opts.prefill.firstName;
      if (opts.prefill.lastName) calPrefill.last_name = opts.prefill.lastName;
      if (opts.prefill.email) calPrefill.email = opts.prefill.email;
    }
    loadCalendly(function () {
      try { window.Calendly.initInlineWidget(opts); } catch (e) {}
    });
    if (!calHooked) {
      calHooked = true;
      window.addEventListener('message', onCalendlyMessage);
    }
  }

  var calPrefill = null;
  var calHooked = false;
  function onCalendlyMessage(e) {
    if (e.origin !== 'https://calendly.com' || !e.data || !e.data.event) return;
    var box = main.querySelector('.cal');
    if (!box) return;
    if (e.data.event === 'calendly.event_type_viewed' && calPrefill) {
      // Calendly's widget only sends the prefill up to 250ms after the frame loads.
      // On a slow phone the booking page is not listening yet and name/email are lost.
      // It says it is ready with event_type_viewed, so send the prefill again then.
      var f = box.querySelector('iframe');
      if (f && f.contentWindow) f.contentWindow.postMessage({ event: 'calendly.prefill', payload: calPrefill }, 'https://calendly.com');
    }
    if (e.data.event === 'calendly.page_height') {
      // When Calendly changes step (day -> times -> details), bring the top of the
      // calendar back into view below the fixed logo bar so its back arrow is visible.
      var barH = document.querySelector('.top').offsetHeight;
      var top = box.getBoundingClientRect().top;
      if (top < barH && top > -box.offsetHeight) {
        window.scrollTo(0, window.scrollY + top - barH - 8);
      }
    }
  }

  function loadCalendly(cb) {
    if (window.Calendly) { cb(); return; }
    var sc = document.createElement('script');
    sc.src = 'https://assets.calendly.com/assets/external/widget.js';
    sc.async = true;
    sc.onload = function () { setTimeout(cb, 200); };
    sc.onerror = function () {};
    document.head.appendChild(sc);
  }

  // Keyboard
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    if (swapping) {
      if (e.key === 'Enter') { e.preventDefault(); if (typeAhead) enterAhead = true; }
      else if (e.key.length === 1) { typeAhead += e.key; e.preventDefault(); }
      return;
    }
    var t = e.target;
    var tag = t && t.tagName;
    if (e.key === 'Enter') {
      if (state.step === -1) {
        if (tag === 'BUTTON') return;
        e.preventDefault(); go(0); return;
      }
      if (state.step >= 0 && state.step < N) {
        if (tag === 'BUTTON') return;
        if (tag === 'TEXTAREA' && (e.shiftKey || touch)) return;
        e.preventDefault();
        next();
      }
      return;
    }
    if (state.step >= 0 && state.step < N && QS[state.step].type === 'choice' && !submitting) {
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key.length !== 1) return;
      var idx = e.key.toUpperCase().charCodeAt(0) - 65;
      var opts = QS[state.step].options || [];
      if (idx >= 0 && idx < opts.length) {
        e.preventDefault();
        pick(state.step, opts[idx].value, main.querySelector('.choices'));
      }
    }
  });

  // Ripple of light from the tap point on any button
  var calmFx = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.addEventListener('pointerdown', function (e) {
    var b = e.target.closest && e.target.closest('.btn');
    if (!b || calmFx || e.button > 0) return;
    var r = b.getBoundingClientRect(), d = document.createElement('span');
    d.className = 'ripple';
    d.style.left = (e.clientX - r.left) + 'px';
    d.style.top = (e.clientY - r.top) + 'px';
    d.style.setProperty('--rs', String(Math.ceil(Math.max(r.width, r.height) * 2.4 / 16)));
    b.appendChild(d);
    setTimeout(function () { d.remove(); }, 700);
  });

  backBtn.addEventListener('click', back);

  setProgress();
  renderWelcome(false);
})();
</script>
</body>
</html>
